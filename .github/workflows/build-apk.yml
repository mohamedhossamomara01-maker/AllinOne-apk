name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install
        run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: Adhan sound
        run: |
          mkdir -p android/app/src/main/res/raw
          if [ -f adhan.mp3 ]; then cp adhan.mp3 android/app/src/main/res/raw/adhan.mp3
          else
            NAME=$(curl -s https://archive.org/metadata/Records-of-Sheikh-Mohammed-Refaat | jq -r '[.files[] | select((.name|test("\\.(mp3|ogg)$")) and ((.title // .name)|contains("أذان")))][0].name')
            echo "adhan file: $NAME"
            if [ -n "$NAME" ] && [ "$NAME" != "null" ]; then
              ENC=$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))' "$NAME")
              curl -L -f -o android/app/src/main/res/raw/adhan.mp3 "https://archive.org/download/Records-of-Sheikh-Mohammed-Refaat/$ENC" || echo "adhan download failed"
            fi
          fi
          ls -la android/app/src/main/res/raw
      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
      - name: Permissions and icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_icon.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#00000000" android:strokeColor="#FFFFFFFF" android:strokeWidth="1.3" android:pathData="M12,1.8a10.2,10.2 0 1,0 0.01,0z"/><path android:fillColor="#FFFFFFFF" android:pathData="M7.2,17.2C7.2,13.8 9.6,12 12,10.4C14.4,12 16.8,13.8 16.8,17.2z M11.5,10.6h1v-1.4h-1z M12.9,4.2a2.1,2.1 0 1,0 0,3.6a1.7,1.7 0 1,1 0,-3.6z M6,17.7h12v1.6h-12z M4.4,17.7V12l1,-1.8l1,1.8v5.7z M17.6,17.7V12l1,-1.8l1,1.8v5.7z"/></vector>
          XML
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.USE_EXACT_ALARM"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><uses-permission android:name="android.permission.WAKE_LOCK"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/><uses-permission android:name="android.permission.VIBRATE"/></manifest>#' $M
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for p in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${p%%:*}; s=${p##*:}
            convert icon-512.png -resize ${s}x${s} $R/mipmap-$d/ic_launcher.png
            convert icon-512.png -resize ${s}x${s} $R/mipmap-$d/ic_launcher_round.png
            rm -f $R/mipmap-$d/ic_launcher_foreground.png
          done
          mkdir -p $R/drawable-nodpi
          convert icon-512.png -resize 192x192 $R/drawable-nodpi/ic_large.png
      - name: Alarm-style adhan channel
        run: |
          cat > android/app/src/main/java/com/allinone/app/MainActivity.java <<'EOF_M'
          package com.allinone.app;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.media.AudioAttributes;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      if (Build.VERSION.SDK_INT >= 26) {
                          NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                          Uri u = Uri.parse("android.resource://" + getPackageName() + "/raw/adhan");
                          AudioAttributes aa = new AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_ALARM)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                                  .build();
                          NotificationChannel ch = new NotificationChannel("adhan_alarm", "الأذان (منبّه)", NotificationManager.IMPORTANCE_HIGH);
                          ch.setDescription("صوت الأذان وقت الصلاة، بيرن حتى لو الموبايل صامت");
                          ch.setSound(u, aa);
                          ch.enableVibration(true);
                          ch.setLockscreenVisibility(1);
                          nm.createNotificationChannel(ch);
                      }
                  } catch (Exception e) { }
              }
          }
          EOF_M
      - name: Prayer widget
        run: |
          R=android/app/src/main/res
          J=android/app/src/main/java/com/allinone/app
          mkdir -p $R/layout $R/xml $R/drawable $J
          cat > $J/PrayerWidget.java <<'EOF_J'
          package com.allinone.app;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.widget.RemoteViews;
          import org.json.JSONObject;
          import java.util.Calendar;

          public class PrayerWidget extends AppWidgetProvider {
              static final String TICK = "com.allinone.app.WIDGET_TICK";
              static final String[] KEYS = {"Fajr", "Sunrise", "Dhuhr", "Asr", "Maghrib", "Isha"};
              static final String[] NAMES = {"الفجر", "الشروق", "الظهر", "العصر", "المغرب", "العشاء"};
              static final int[] NID = {R.id.n0, R.id.n1, R.id.n2, R.id.n3, R.id.n4, R.id.n5};
              static final int[] TID = {R.id.t0, R.id.t1, R.id.t2, R.id.t3, R.id.t4, R.id.t5};

              @Override
              public void onUpdate(Context c, AppWidgetManager m, int[] ids) {
                  for (int id : ids) update(c, m, id);
              }

              @Override
              public void onReceive(Context c, Intent i) {
                  super.onReceive(c, i);
                  if (TICK.equals(i.getAction())) {
                      AppWidgetManager m = AppWidgetManager.getInstance(c);
                      int[] ids = m.getAppWidgetIds(new ComponentName(c, PrayerWidget.class));
                      for (int id : ids) update(c, m, id);
                  }
              }

              static String fmt(int mins) {
                  int h = mins / 60, mm = mins % 60;
                  int h12 = h % 12 == 0 ? 12 : h % 12;
                  return h12 + ":" + (mm < 10 ? "0" : "") + mm + (h >= 12 ? " م" : " ص");
              }

              static void update(Context c, AppWidgetManager m, int id) {
                  RemoteViews v = new RemoteViews(c.getPackageName(), R.layout.prayer_widget);
                  int[] mins = new int[6];
                  boolean ok = false;
                  try {
                      String s = c.getSharedPreferences("CapacitorStorage", Context.MODE_PRIVATE).getString("prayer_widget", null);
                      if (s != null) {
                          JSONObject j = new JSONObject(s);
                          Calendar n = Calendar.getInstance();
                          String key = n.get(Calendar.YEAR) + "-" + (n.get(Calendar.MONTH) + 1) + "-" + n.get(Calendar.DAY_OF_MONTH);
                          JSONObject o = j.optJSONObject(key);
                          if (o != null) {
                              for (int i = 0; i < 6; i++) mins[i] = o.optInt(KEYS[i], -1);
                              ok = true;
                          }
                      }
                  } catch (Exception e) { ok = false; }
                  Calendar now = Calendar.getInstance();
                  int nowMin = now.get(Calendar.HOUR_OF_DAY) * 60 + now.get(Calendar.MINUTE);
                  int next = -1;
                  if (ok) {
                      for (int i = 0; i < 6; i++) { if (i == 1) continue; if (mins[i] > nowMin) { next = i; break; } }
                      for (int i = 0; i < 6; i++) {
                          v.setTextViewText(NID[i], NAMES[i]);
                          v.setTextViewText(TID[i], mins[i] >= 0 ? fmt(mins[i]) : "--");
                          int col = (i == next) ? Color.parseColor("#F5B942") : Color.WHITE;
                          v.setTextColor(NID[i], col);
                          v.setTextColor(TID[i], col);
                      }
                      v.setTextViewText(R.id.title, next >= 0 ? "الصلاة الجاية: " + NAMES[next] + " " + fmt(mins[next]) : "خلصت صلوات النهاردة");
                  } else {
                      for (int i = 0; i < 6; i++) { v.setTextViewText(NID[i], NAMES[i]); v.setTextViewText(TID[i], "--"); }
                      v.setTextViewText(R.id.title, "افتح التطبيق مرة عشان تظهر المواقيت");
                  }
                  Intent launch = c.getPackageManager().getLaunchIntentForPackage(c.getPackageName());
                  if (launch != null) {
                      v.setOnClickPendingIntent(R.id.root, PendingIntent.getActivity(c, 0, launch, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT));
                  }
                  m.updateAppWidget(id, v);
                  try {
                      int target = next >= 0 ? mins[next] + 1 : 24 * 60 + 1;
                      Calendar t = Calendar.getInstance();
                      t.set(Calendar.HOUR_OF_DAY, 0); t.set(Calendar.MINUTE, 0); t.set(Calendar.SECOND, 0); t.set(Calendar.MILLISECOND, 0);
                      t.add(Calendar.MINUTE, target);
                      AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                      Intent ti = new Intent(c, PrayerWidget.class);
                      ti.setAction(TICK);
                      PendingIntent pi = PendingIntent.getBroadcast(c, 77, ti, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                      am.set(AlarmManager.RTC, t.getTimeInMillis(), pi);
                  } catch (Exception e) { }
              }
          }
          EOF_J
          cat > $R/layout/prayer_widget.xml <<'EOF_L'
          <?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:id="@+id/root" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:padding="10dp" android:gravity="center" android:background="@drawable/widget_bg" android:layoutDirection="rtl"><TextView android:id="@+id/title" android:layout_width="match_parent" android:layout_height="wrap_content" android:gravity="center" android:textColor="#F5B942" android:textSize="12sp" android:textStyle="bold" android:text="مواقيت الصلاة"/><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="6dp" android:orientation="horizontal" android:layoutDirection="rtl"><LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical" android:gravity="center"><TextView android:id="@+id/n0" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#FFFFFF" android:textSize="11sp" android:text="--"/><TextView android:id="@+id/t0" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#FFFFFF" android:textSize="12sp" android:textStyle="bold" android:text="--"/></LinearLayout><LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical" android:gravity="center"><TextView android:id="@+id/n1" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#FFFFFF" android:textSize="11sp" android:text="--"/><TextView android:id="@+id/t1" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#FFFFFF" android:textSize="12sp" android:textStyle="bold" android:text="--"/></LinearLayout><LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical" android:gravity="center"><TextView android:id="@+id/n2" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#FFFFFF" android:textSize="11sp" android:text="--"/><TextView android:id="@+id/t2" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#FFFFFF" android:textSize="12sp" android:textStyle="bold" android:text="--"/></LinearLayout><LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical" android:gravity="center"><TextView android:id="@+id/n3" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#FFFFFF" android:textSize="11sp" android:text="--"/><TextView android:id="@+id/t3" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#FFFFFF" android:textSize="12sp" android:textStyle="bold" android:text="--"/></LinearLayout><LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical" android:gravity="center"><TextView android:id="@+id/n4" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#FFFFFF" android:textSize="11sp" android:text="--"/><TextView android:id="@+id/t4" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#FFFFFF" android:textSize="12sp" android:textStyle="bold" android:text="--"/></LinearLayout><LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical" android:gravity="center"><TextView android:id="@+id/n5" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#FFFFFF" android:textSize="11sp" android:text="--"/><TextView android:id="@+id/t5" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#FFFFFF" android:textSize="12sp" android:textStyle="bold" android:text="--"/></LinearLayout></LinearLayout></LinearLayout>
          EOF_L
          cat > $R/drawable/widget_bg.xml <<'EOF_B'
          <?xml version="1.0" encoding="utf-8"?><shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><solid android:color="#E60F2A2D"/><corners android:radius="18dp"/></shape>
          EOF_B
          cat > $R/xml/prayer_widget_info.xml <<'EOF_I'
          <?xml version="1.0" encoding="utf-8"?><appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android" android:minWidth="250dp" android:minHeight="70dp" android:updatePeriodMillis="1800000" android:initialLayout="@layout/prayer_widget" android:resizeMode="horizontal" android:widgetCategory="home_screen"/>
          EOF_I
          sed -i 's#</application>#<receiver android:name=".PrayerWidget" android:exported="true"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/><action android:name="com.allinone.app.WIDGET_TICK"/></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/prayer_widget_info"/></receiver></application>#' android/app/src/main/AndroidManifest.xml
      - name: Sync
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AllinOne-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
